<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Team Pulse — L10</title>
<style>
  :root{ --navy:#1F2A44; --red:#E7442B; --bg:#F4F6F9; --border:#E2E7EF; --borderSoft:#EDF0F5; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); font-family:'Corbel','Segoe UI',system-ui,-apple-system,sans-serif; }
  #root{ min-height:100vh; }
  @keyframes tp-spin{ to{ transform:rotate(360deg); } }
  @keyframes tp-rise{ from{ opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
  .tp-in{ border:1px solid var(--border); border-radius:7px; padding:7px 9px; font:inherit; color:#1F2A44; background:#fff; width:100%; outline:none; }
  .tp-in:focus{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(31,42,68,.08); }
  .tp-navbtn:hover{ background:rgba(255,255,255,.08); }
  .tp-row:hover{ background:var(--borderSoft); }
  .tp-icon{ cursor:pointer; color:#8A94A6; display:inline-flex; }
  .tp-icon:hover{ color:var(--red); }
  .tp-primary:hover{ filter:brightness(1.08); }
  .tp-ghost:hover{ background:var(--borderSoft); }
  .tp-chipbtn:hover{ filter:brightness(0.98); }
  @media (max-width:820px){ .tp-side{ display:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- External Libraries -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
  async function checkUserAccess() {
    const response = await fetch('/.auth/me');
    const payload = await response.json();
    const clientPrincipal = payload.clientPrincipal;

    if (!clientPrincipal) {
      window.location.href = '/.auth/login/aad';
      return;
    }

    const userDetails = clientPrincipal.userDetails || '';
    if (!userDetails.endsWith('@boostworks.co.uk')) {
      alert('Access denied. Only @boostworks.co.uk accounts are allowed.');
      window.location.href = '/.auth/logout';
    }
  }

  checkUserAccess();
</script>
  
<script>
window.addEventListener("error", function(e) {
  var r = document.getElementById("root");
  if (r && !r.hasChildNodes()) {
    r.innerHTML = "<div style=\"padding:24px;font-family:Segoe UI,sans-serif;color:#b00\"><b>The dashboard hit an error:</b><br><pre style=\"white-space:pre-wrap\">" + (e.message || "") + "</pre></div>";
  }
});
</script>

<script>
/* Team Pulse — Excel backend sync layer (Popup Flow Only). */
(function(){
  var CONFIG = {
    tenantId: "a6fa4a06-5e81-4111-bea5-fbd229b24c60",
    clientId: "a5b6eeff-e4ea-4abe-9ee7-09e5b58f0008",
    siteHostname: "boostworks.sharepoint.com",
    sitePath: "/sites/PartnershipContent",
    filePath: "TeamPulse-Data.xlsx",
    scopes: ["User.Read","Sites.Selected"],
    storageKey: "teampulse:board:v4",
    dataSheet: "Data"
  };
  var GRAPH = "https://graph.microsoft.com/v1.0";
  var TP = window.TP = { connected:false, autosync:true, configured: CONFIG.clientId.indexOf("<")!==0, _drive:null, _item:null };

  var panel, statusEl;
  function ui(){
    panel = document.createElement("div");
    panel.style.cssText = "position:fixed;bottom:14px;right:14px;z-index:99999;background:#fff;border:1px solid #E2E7EF;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.10);padding:8px 12px;font:600 12.5px 'Segoe UI',sans-serif;color:#1F2A44;display:flex;align-items:center;gap:10px";
    statusEl = document.createElement("span");
    panel.appendChild(statusEl);
    document.body.appendChild(panel);
    render();
  }
  function btn(label,fn){ var b = document.createElement("button"); b.textContent = label; b.style.cssText = "background:#1F2A44;color:#fff;border:none;border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer"; b.onclick = fn; return b; }
  function dot(color){ return '<span style="display:inline-block;width:9px;height:9px;border-radius:9px;background:'+color+';margin-right:6px"></span>'; }
  function render(msg){
    if(!statusEl) return;
    statusEl.innerHTML = "";
    var wrap = document.createElement("span");
    if(!TP.connected){ wrap.innerHTML = dot("#E8A317")+"Not connected"; panel.replaceChildren(wrap, btn("Connect",connect)); return; }
    wrap.innerHTML = dot("#2E9E5B")+"Connected to shared file"+(msg?" · "+msg:"");
    panel.replaceChildren(wrap, btn("Load latest",loadLatest));
  }
  function say(m){ render(m); }
  function err(m){ console.error("TP sync:",m); if(!panel) return; var s = document.createElement("span"); s.innerHTML = dot("#E7442B")+String(m).slice(0,200); panel.replaceChildren(s, btn("Retry",connect)); }

  var msalApp;
  function initMsal(){
    if(msalApp) return msalApp;
    if(typeof msal === "undefined"){ throw new Error("MSAL library failed to load from CDN."); }
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.clientId,
        authority: "https://login.microsoftonline.com/" + CONFIG.tenantId,
        redirectUri: window.location.origin
      },
      cache: { cacheLocation: "localStorage" }
    });
    return msalApp;
  }

  async function token(){
    var app = initMsal();
    await app.initialize();
    var accounts = app.getAllAccounts();
    var acct = accounts[0];
    if (!acct) {
      var r = await app.loginPopup({ scopes: CONFIG.scopes });
      app.setActiveAccount(r.account);
      return r.accessToken;
    }
    app.setActiveAccount(acct);
    try {
      var silentRes = await app.acquireTokenSilent({ account: acct, scopes: CONFIG.scopes });
      return silentRes.accessToken;
    } catch (e) {
      var popupRes = await app.acquireTokenPopup({ scopes: CONFIG.scopes });
      return popupRes.accessToken;
    }
  }

  async function g(path, method, body){
    var t = await token();
    var res = await fetch(path.indexOf("http")===0 ? path : GRAPH+path, {
      method: method || "GET",
      headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok){ throw new Error("Graph API Error " + res.status); }
    return res.status === 204 ? null : res.json();
  }

  async function resolveFile(){
    if(TP._drive && TP._item) return;
    var site = await g("/sites/" + CONFIG.siteHostname + ":" + CONFIG.sitePath);
    var item = await g("/sites/" + site.id + "/drive/root:/" + CONFIG.filePath);
    TP._item = item.id;
    TP._drive = item.parentReference.driveId;
  }

  async function readBoard(){
    await resolveFile();
    var base = "/drives/" + TP._drive + "/items/" + TP._item + "/workbook/worksheets('" + CONFIG.dataSheet + "')";
    var r = await g(base + "/usedRange(valuesOnly=true)");
    var vals = (r && r.values) || [];
    var js = "";
    for(var i=1; i<vals.length; i++){ if(vals[i] && vals[i][0]) js += vals[i][0]; }
    return js ? JSON.parse(js) : null;
  }

  async function writeBoard(jsonStr){
    await resolveFile();
    var base = "/drives/" + TP._drive + "/items/" + TP._item + "/workbook/worksheets('" + CONFIG.dataSheet + "')";
    var CH = 30000, chunks = [];
    for(var i=0; i<jsonStr.length; i+=CH) chunks.push([jsonStr.slice(i, i+CH)]);
    if(!chunks.length) chunks = [[""]];
    await g(base + "/range(address='A2:A20000')/clear", 'POST', { applyTo: "Contents" });
    await g(base + "/range(address='A2:A" + (1+chunks.length) + "')", 'PATCH', { values: chunks });
  }

  var _set = Storage.prototype.setItem, pushTimer = null;
  Storage.prototype.setItem = function(k,v){
    _set.call(this, k, v);
    if(k===CONFIG.storageKey && TP.connected && TP.autosync && !TP._loading){
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function(){
        writeBoard(v).then(function(){
          say("saved " + new Date().toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" }));
        }).catch(function(e){ err(e.message); });
      }, 1800);
    }
  };

  async function loadLatest(){
    try{
      say("loading…");
      TP._loading = true;
      var board = await readBoard();
      if(board){ _set.call(localStorage, CONFIG.storageKey, JSON.stringify(board)); }
      sessionStorage.setItem("tp_synced", "1");
      location.reload();
    } catch(e){
      TP._loading = false;
      err(e.message);
    }
  }

  async function connect(){
    try{
      await token();
      TP.connected = true;
      render();
      if(!sessionStorage.getItem("tp_synced")){ await loadLatest(); }
    } catch(e){
      err(e.message);
    }
  }

  function boot(){
    ui();
    var app = initMsal();
    app.initialize().then(function(){
      if(app.getAllAccounts().length > 0){
        TP.connected = true;
        render();
        if(!sessionStorage.getItem("tp_synced")){ loadLatest(); }
      }
    }).catch(function(e){ err(e.message); });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

<script>
const { useState, useEffect, useMemo, useRef } = React;
const STORAGE_KEY = "teampulse:board:v4";
const APP_VERSION = "2.1";
const OWNERS = ["", "Enzo", "ES", "Phil", "Kim", "Stuart", "Sofia", "All"];
const HL_STATUS = ["", "Open", "In progress", "Complete"];
const t = {
  navy: "#1F2A44", navyDeep: "#161F33", red: "#E7442B", green: "#2E9E5B", amber: "#E8A317",
  bg: "#F4F6F9", card: "#FFFFFF", ink: "#1F2A44", body: "#4A5568", muted: "#8A94A6",
  border: "#E2E7EF", borderSoft: "#EDF0F5", font: "'Corbel','Segoe UI',system-ui,-apple-system,sans-serif"
};

function seed() {
  return {
    meta: { team: "Partner & Content — L10", weekOf: "2026-07-21", lastUpdated: null, build: null, commentaryText: "" },
    metrics: [], rocks: [], headlines: [], issues: [], todos: [],
    archive: { headlines: [], rocks: [], todos: [], issues: [] }
  };
}

function normalize(b) {
  if (!b.meta) b.meta = {};
  if (!b.archive) b.archive = { headlines: [], rocks: [], todos: [], issues: [] };
  return b;
}

function loadBoard() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    if (r) return normalize(JSON.parse(r));
  } catch (_) {}
  return null;
}

function saveBoard(b) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(b)); } catch (_) {}
}

function App() {
  const [board, setBoard] = useState(null);
  useEffect(() => { setBoard(normalize(loadBoard() || seed())); }, []);
  useEffect(() => { if (board) saveBoard(board); }, [board]);

  if (!board) return React.createElement("div", { style: { padding: 40, fontFamily: t.font } }, "Loading...");

  return React.createElement("div", { style: { fontFamily: t.font, background: t.bg, minHeight: "100vh", color: t.body, display: "flex" } },
    React.createElement("div", { style: { padding: 40, flex: 1 } },
      React.createElement("h1", { style: { color: t.ink } }, board.meta.team),
      React.createElement("p", null, "Dashboard active. Click the bottom-right widget to connect via MSAL popup and sync with Excel.")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>

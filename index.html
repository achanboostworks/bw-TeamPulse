<script>
  async function checkUserAccess() {
  const response = await fetch('/.auth/me');
  const payload = await response.json();
  const clientPrincipal = payload.clientPrincipal;

  if (!clientPrincipal) {
    // Not logged in, redirect to login
    window.location.href = '/.auth/login/aad';
    return;
  }

  // Check user details / claims for the email or user ID
  const userDetails = clientPrincipal.userDetails || '';
  
  if (!userDetails.endsWith('@boostworks.co.uk')) {
    alert('Access denied. Only @boostworks.co.uk accounts are allowed.');
    window.location.href = '/.auth/logout';
  }
}

checkUserAccess();
</script>

<script>
/* Team Pulse — Excel backend sync layer. */
(function(){
  var CONFIG = {
    tenantId: "a6fa4a06-5e81-4111-bea5-fbd229b24c60",
    clientId: "a5b6eeff-e4ea-4abe-9ee7-09e5b58f0008",
    siteHostname: "boostworks.sharepoint.com",
    sitePath: "/sites/PartnershipContent",
    filePath: "TeamPulse-Data.xlsx",
    scopes: ["User.Read","Sites.Selected"],
    storageKey: "teampulse:board:v4",
    dataSheet: "Data"
  };
  var GRAPH = "https://graph.microsoft.com/v1.0";
  var TP = window.TP = { connected:false, autosync:true, configured: CONFIG.clientId.indexOf("<")!==0, _drive:null, _item:null };

  var panel, statusEl;
  function ui(){
    panel = document.createElement("div");
    panel.style.cssText = "position:fixed;bottom:14px;right:14px;z-index:99999;background:#fff;border:1px solid #E2E7EF;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.10);padding:8px 12px;font:600 12.5px 'Segoe UI',sans-serif;color:#1F2A44;display:flex;align-items:center;gap:10px";
    statusEl = document.createElement("span");
    panel.appendChild(statusEl);
    document.body.appendChild(panel);
    render();
  }
  function btn(label,fn){ var b = document.createElement("button"); b.textContent = label; b.style.cssText = "background:#1F2A44;color:#fff;border:none;border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer"; b.onclick = fn; return b; }
  function dot(color){ return '<span style="display:inline-block;width:9px;height:9px;border-radius:9px;background:'+color+';margin-right:6px"></span>'; }
  function render(msg){
    if(!statusEl) return;
    statusEl.innerHTML = "";
    var wrap = document.createElement("span");
    if(!TP.configured){ wrap.innerHTML = dot("#8A94A6")+"Running locally (not yet connected)"; panel.replaceChildren(wrap); return; }
    if(!TP.connected){ wrap.innerHTML = dot("#E8A317")+"Not connected"; panel.replaceChildren(wrap, btn("Connect",connect)); return; }
    wrap.innerHTML = dot("#2E9E5B")+"Connected to shared file"+(msg?" · "+msg:"");
    panel.replaceChildren(wrap, btn("Load latest",loadLatest));
  }
  function say(m){ render(m); }
  function err(m){ console.error("TP sync:",m); if(!panel) return; var s = document.createElement("span"); s.innerHTML = dot("#E7442B")+String(m).slice(0,200); panel.replaceChildren(s, btn("Retry",connect)); }

  var msalApp;
  function initMsal(){
    if(msalApp) return msalApp;
    if(typeof msal === "undefined"){ throw new Error("MSAL library failed to load from CDN. Check your network or content blocker."); }
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.clientId,
        authority: "https://login.microsoftonline.com/" + CONFIG.tenantId,
        redirectUri: window.location.origin
      },
      cache: { cacheLocation: "localStorage" },
      system: {
        hashHandling: "hash"
      }
    });
    return msalApp;
  }
  var _ready = false;
  async function ensure(){ 
    if(!_ready){ 
      await initMsal().initialize(); 
      await msalApp.handleRedirectPromise();
      _ready = true; 
    } 
  }
  async function token(){
    await ensure();
    var acct = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0];
    if(!acct){
      var r = await msalApp.loginPopup({ scopes: CONFIG.scopes });
      msalApp.setActiveAccount(r.account);
      acct = r.account;
    }
    try{
      return (await msalApp.acquireTokenSilent({ account: acct, scopes: CONFIG.scopes })).accessToken;
    } catch(e){
      return (await msalApp.acquireTokenPopup({ scopes: CONFIG.scopes })).accessToken;
    }
  }

  async function g(path,method,body){
    var t = await token();
    var res = await fetch(path.indexOf("http")===0?path:GRAPH+path,{
      method: method || "GET",
      headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok){
      var st = res.status;
      var hint = st===403 ? "No write access to the site yet — grant the app Write on PartnershipContent (Sites.Selected)." :
                 st===404 ? "Couldn’t find TeamPulse-Data.xlsx in the Documents library." :
                 st===401 ? "Sign-in expired — click Connect again." : ("Error " + st);
      throw new Error(hint + " [" + st + "]");
    }
    return res.status===204 ? null : res.json();
  }
  async function resolveFile(){
    if(TP._drive && TP._item) return;
    var site = await g("/sites/" + CONFIG.siteHostname + ":" + CONFIG.sitePath);
    var item = await g("/sites/" + site.id + "/drive/root:/" + CONFIG.filePath);
    TP._item = item.id;
    TP._drive = item.parentReference.driveId;
  }
  function wbBase(){ return "/drives/" + TP._drive + "/items/" + TP._item + "/workbook/worksheets('" + CONFIG.dataSheet + "')"; }
  async function readBoard(){
    await resolveFile();
    var r = await g(wbBase() + "/usedRange(valuesOnly=true)");
    var vals = (r && r.values) || [];
    var js = "";
    for(var i=1; i<vals.length; i++){ if(vals[i] && vals[i][0]) js += vals[i][0]; }
    return js ? JSON.parse(js) : null;
  }
  async function writeBoard(jsonStr){
    await resolveFile();
    var CH = 30000, chunks = [];
    for(var i=0; i<jsonStr.length; i+=CH) chunks.push([jsonStr.slice(i, i+CH)]);
    if(!chunks.length) chunks = [[""]];
    await g(wbBase() + "/range(address='A2:A20000')/clear", 'POST', { applyTo: "Contents" });
    await g(wbBase() + "/range(address='A2:A" + (1+chunks.length) + "')", 'PATCH', { values: chunks });
  }

  var _set = Storage.prototype.setItem, pushTimer = null;
  Storage.prototype.setItem = function(k,v){
    _set.call(this, k, v);
    if(k===CONFIG.storageKey && TP.connected && TP.autosync && !TP._loading){
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function(){
        writeBoard(v).then(function(){
          say("saved " + new Date().toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" }));
        }).catch(function(e){ err(e.message); });
      }, 1800);
    }
  };

  async function loadLatest(){
    try{
      say("loading…");
      TP._loading = true;
      var board = await readBoard();
      if(board){ _set.call(localStorage, CONFIG.storageKey, JSON.stringify(board)); }
      sessionStorage.setItem("tp_synced", "1");
      location.reload();
    } catch(e){
      TP._loading = false;
      err(e.message);
    }
  }
  async function connect(){
    try{
      initMsal();
      await token();
      TP.connected = true;
      render();
      if(!sessionStorage.getItem("tp_synced")){ await loadLatest(); }
    } catch(e){
      err(e.message);
    }
  }

  function boot(){
    ui();
    if(!TP.configured){ render(); return; }
    try{
      initMsal();
      ensure().then(function(){
        var signedIn = msalApp.getAllAccounts().length > 0;
        if(signedIn){
          TP.connected = true;
          render();
          if(!sessionStorage.getItem("tp_synced")){ loadLatest(); }
        } else {
          render();
        }
      }).catch(function(e){ err(e.message); });
    } catch(e){ err(e.message); }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

const num = v => {
  if (typeof v === "number") return v;
  if (v == null) return NaN;
  const s = String(v).replace(/[, ]/g, "").replace(/[£$%]/g, "");
  return parseFloat(s);
};
const parseTarget = g => {
  if (g == null) return NaN;
  let s = String(g).replace(/[<>~ £$]/g, "").toLowerCase();
  let m = 1;
  if (s.endsWith("k")) {
    m = 1e3;
    s = s.slice(0, -1);
  } else if (s.endsWith("m")) {
    m = 1e6;
    s = s.slice(0, -1);
  }
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n * m;
};
const fmtVal = v => {
  const n = num(v);
  if (isNaN(n)) return String(v ?? "");
  if (Math.abs(n) >= 1000) return n.toLocaleString();

};

function cumulativeOf(m) {
  const tg = parseTarget(m.goal);
  const pctTarget = !isNaN(tg) && Math.abs(tg) < 1;
  const allFrac = m.history.length > 0 && m.history.every(h => {
    const n = num(h.value);
    return !isNaN(n) && Math.abs(n) <= 1;
  });
  if (pctTarget || allFrac) return null;
  return m.history.reduce((a, h) => {
    const n = num(h.value);

  }, 0);
}

function normalize(b) {
  if (!b.meta) b.meta = {};
  if (b.meta.build !== APP_VERSION) {
    b.meta.build = APP_VERSION;
    b.meta.lastUpdated = nowISO();
  }
  if (!b.meta.lastUpdated) b.meta.lastUpdated = nowISO();
  if (b.meta.commentaryText == null) b.meta.commentaryText = "";
  if (!b.archive) b.archive = { headlines: [], rocks: [], todos: [], issues: [] };
  ["headlines", "rocks", "todos", "issues"].forEach(k => {
    if (!b.archive[k]) b.archive[k] = [];
  });
  b.metrics = (b.metrics || []).map(m => ({
    ...m,
    history: (m.history || []).slice().sort((a, c) => a.week < c.week ? -1 : 1)
  }));
  b.headlines = (b.headlines || []).map(h => h.title != null ? { commentary: "", ...h } : { ...h, title: h.text || "", commentary: h.commentary || "" });
  return b;
}

function loadBoard() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    if (r) return normalize(JSON.parse(r));
  } catch (_) {}
  return null;
}

function saveBoard(b) {
  try {

  const archive = id => setBoard(b => {

    return {

  const toIssue = id => setBoard(b => {

  const filters = [["all", "All"], ["open", "Open"], ["overdue", "Overdue"], ["done", "Done"]];

  return React.createElement("div", null,
    React.createElement(SectionTitle, { sub: "The action log. Task, owner and dates are fixed — click the pencil to change. Tick Done freely; commentary is time-stamped." }, "To-dos"),
    React.createElement("div", { style: card },
      React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" } },
        filters.map(([k, label]) => React.createElement("button", {
          key: k,
          onClick: () => setFilter(k),
          className: "tp-chipbtn",
          style: {
            border: `1px solid ${filter === k ? t.navy : t.border}`,

          }
        }, label))
      ),
      shown.map(d => {
        const ed = editId === d.id;
        return React.createElement("div", { key: d.id, style: { borderBottom: `1px solid ${t.borderSoft}`, padding: "10px 4px" } },
          React.createElement("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" } },
            React.createElement("input", {
              type: "checkbox",
              checked: d.done,

              style: { width: 17, height: 17, accentColor: t.green, cursor: "pointer" }
            }),
            ed ? React.createElement("input", {
              className: "tp-in",
              value: d.task,
              onChange: e => up(d.id, { task: e.target.value }),
              placeholder: "Title",
              style: { flex: 1, minWidth: 200, fontWeight: 600, color: t.ink }
            }) : React.createElement("div", {
              style: {
                flex: 1,

            React.createElement(EditToggle, { on: ed, onClick: () => setEditId(ed ? null : d.id) }),

            ) : React.createElement(Locked, { label: "Owner", value: d.owner }),

            ) : React.createElement(Locked, { label: "Raised", value: d.raised }),

              React.createElement("input", { className: "tp-in", type: "date", value: d.due, onChange: e => up(d.id, { due: e.target.value }), style: { width: 150 } })
            ) : React.createElement(Locked, { label: "Due", value: d.due })
          ),

          }),

        );
      }),

        doneCount > 0 && React.createElement("button", { onClick: archiveDone, style: { ...btnAdd, borderStyle: "solid", color: t.green, borderColor: t.green } },
          React.createElement(Icon, { name: "archive", size: 15 }), " Archive ", doneCount, " completed"

}

function ArchiveView({ board, setBoard }) {
  const restore = (type, id) => setBoard(b => {
    const it = b.archive[type].find(x => x.id === id);
    if (!it) return b;
    const { archivedOn, ...clean } = it;
    toast("Restored");
    return {
      ...b,
      [type]: [...b[type], clean],
      archive: { ...b.archive, [type]: b.archive[type].filter(x => x.id !== id) }
    };
  });

  const del = (type, id) => {
    if (!confirmDel("Permanently delete this archived item?")) return;
    setBoard(b => ({
      ...b,
      archive: { ...b.archive, [type]: b.archive[type].filter(x => x.id !== id) }
    }));
    toast("Deleted");
  };

  const groups = [
    { type: "rocks", label: "Rocks", get: x => x.title },
    { type: "headlines", label: "Headlines", get: x => x.title },
    { type: "issues", label: "Issues", get: x => x.title },
    { type: "todos", label: "To-dos", get: x => x.task }
  ];
  const empty = groups.every(g => board.archive[g.type].length === 0);

  return React.createElement("div", null,
    React.createElement(SectionTitle, { sub: "Delivered and actioned items, kept for reference. Restore any item to bring it back." }, "Archive"),
    empty && React.createElement("div", { style: card },
      React.createElement("div", { style: { color: t.muted, fontSize: 14 } }, "Nothing archived yet. Use the archive icon on a rock, headline, issue or to-do once it's delivered.")
    ),
    groups.map(g => board.archive[g.type].length > 0 && React.createElement("div", { key: g.type, style: { ...card, marginBottom: 14 } },
      React.createElement("div", { style: { fontWeight: 700, color: t.ink, fontSize: 15, marginBottom: 10 } },
        g.label, " ", React.createElement("span", { style: { color: t.muted, fontWeight: 500 } }, "· ", board.archive[g.type].length)
      ),
      board.archive[g.type].map(x => React.createElement("div", {
        key: x.id,
        className: "tp-row",
        style: { display: "flex", gap: 10, alignItems: "center", padding: "9px 6px", borderBottom: `1px solid ${t.borderSoft}` }
      },
      React.createElement("span", { style: { flex: 1, color: t.body, fontSize: 14 } }, g.get(x)),
      React.createElement("span", { style: { fontSize: 12, color: t.muted, whiteSpace: "nowrap" } }, x.archivedOn),
      React.createElement("span", { className: "tp-icon", onClick: () => restore(g.type, x.id), title: "Restore" },
        React.createElement(Icon, { name: "restore", size: 16 })
      ),
      React.createElement(DelBtn, { onClick: () => del(g.type, x.id), title: "Delete permanently" })
      ))
    ))
  );
}

function Intake({ board, setBoard, setView }) {
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [proposal, setProposal] = useState(null);
  const [picked, setPicked] = useState({});

  const extract = async () => {
    if (!text.trim()) return;
    setLoading(true);
    setError("");
    setProposal(null);
    const prompt = 'Read this transcript, return ONLY compact JSON: {"todos":[{"task":"","owner":""}],"issues":[{"title":"","owner":""}],"headlines":[{"text":"","owner":""}],"rockNotes":[{"match":"","note":""}]}. Short strings, owners only if named. Rocks: ' + board.rocks.map(r => r.title.slice(0, 60)).join(" | ") + "\n\nTRANSCRIPT:\n" + text.slice(0, 8000);
    try {
      const response = await fetch("/api/generateCommentary", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt })
      });
      if (!response.ok) throw new Error("API call failed with status " + response.status);
      const res = await response.json();
      const out = res.commentary || "";
      const parsed = JSON.parse(out.replace(/```json/gi, "").replace(/```/g, "").trim());
      setProposal(parsed);
      const p = {};
      (parsed.todos || []).forEach((_, i) => p["todo" + i] = true);
      (parsed.issues || []).forEach((_, i) => p["issue" + i] = true);
      (parsed.headlines || []).forEach((_, i) => p["hl" + i] = true);
      (parsed.rockNotes || []).forEach((_, i) => p["rock" + i] = true);
      setPicked(p);
    } catch (e) {
      setError(e.message || "Couldn't process transcript.");
    } finally {
      setLoading(false);
    }
  };

  const apply = () => {
    const p = proposal;
    setBoard(b => {
      const nb = {
        ...b,
        todos: [...b.todos],
        issues: [...b.issues],
        headlines: [...b.headlines],
        rocks: b.rocks.map(r => ({ ...r }))
      };
      (p.todos || []).forEach((it, i) => {
        if (picked["todo" + i]) nb.todos.push({
          id: uid(),
          task: it.task || "",
          owner: it.owner || "",
          raised: today(),
          due: "",
          note: "",
          noteAt: null,
          done: false
        });
      });
      (p.issues || []).forEach((it, i) => {
        if (picked["issue" + i]) nb.issues.push({
          id: uid(),
          title: it.title || "",
          owner: it.owner || "",
          date: today(),
          priority: String(nb.issues.length + 1),
          rag: "A",
          note: "",
          noteAt: null
        });
      });
      (p.headlines || []).forEach((it, i) => {
        if (picked["hl" + i] && it.text) nb.headlines.push({
          id: uid(),
          title: it.text,
          commentary: "",
          commentaryAt: null,
          owner: it.owner || "",
          status: "",
          date: today()
        });
      });
      (p.rockNotes || []).forEach((it, i) => {
        if (!picked["rock" + i]) return;
        const key = (it.match || "").toLowerCase().split(" ")[0];
        const idx = nb.rocks.findIndex(r => key && r.title.toLowerCase().includes(key));
        if (idx >= 0) nb.rocks[idx].note = (nb.rocks[idx].note ? nb.rocks[idx].note + " · " : "") + (it.note || "");
        else nb.issues.push({
          id: uid(),
          title: (it.match ? it.match + ": " : "") + (it.note || ""),
          owner: "",
          date: today(),
          priority: String(nb.issues.length + 1),
          rag: "A",
          note: "",
          noteAt: null
        });
      });
      return nb;
    });
    setProposal(null);
    setText("");
    setPicked({});
    setView("overview");
    toast("Applied to board");
  };

  const toggle = k => setPicked(p => ({ ...p, [k]: !p[k] }));
  const has = proposal && ((proposal.todos || []).length || (proposal.issues || []).length || (proposal.headlines || []).length || (proposal.rockNotes || []).length);

  return React.createElement("div", null,
    React.createElement(SectionTitle, { sub: "Paste a transcript. It proposes updates; you choose what to apply." }, "Transcript intake"),
    React.createElement("div", { style: card },
      React.createElement("textarea", {
        className: "tp-in",
        value: text,
        onChange: e => setText(e.target.value),
        rows: 9,
        placeholder: "Paste your transcript here…",
        style: { resize: "vertical", fontFamily: "'Consolas',monospace", fontSize: 13 }
      }),
      React.createElement("div", { style: { display: "flex", gap: 10, alignItems: "center", marginTop: 12, flexWrap: "wrap" } },
        React.createElement("button", {
          onClick: extract,
          disabled: loading || !text.trim(),
          className: "tp-primary",
          style: { ...btnPrimary, display: "flex", alignItems: "center", gap: 7, opacity: loading || !text.trim() ? 0.6 : 1 }
        },
        loading ? React.createElement(Icon, { name: "loader", size: 14 }) : React.createElement(Icon, { name: "sparkles", size: 14 }),
        loading ? "Reading…" : "Extract updates"
        ),
        React.createElement("span", { style: { fontSize: 12.5, color: t.muted } }, "Nothing changes until you apply.")
      )
    ),
    error && React.createElement("div", { style: { ...card, marginTop: 14 } },
      React.createElement("div", { style: notice(t.amber, RAG.A.soft) }, error)
    ),
    proposal && React.createElement("div", { style: { ...card, marginTop: 14 } },
      React.createElement("div", { style: { fontWeight: 700, color: t.ink, fontSize: 15, marginBottom: 12 } }, "Proposed updates — tick what to apply"),
      !has && React.createElement("div", { style: { color: t.muted, fontSize: 14 } }, "Nothing actionable found."),
      React.createElement(ProposalGroup, {
        title: "To-dos",
        items: (proposal.todos || []).map((it, i) => ({ key: "todo" + i, label: it.task + (it.owner ? ` — ${it.owner}` : "") })),
        picked: picked,
        toggle: toggle
      }),
      React.createElement(ProposalGroup, {
        title: "Issues",
        items: (proposal.issues || []).map((it, i) => ({ key: "issue" + i, label: it.title + (it.owner ? ` — ${it.owner}` : "") })),
        picked: picked,
        toggle: toggle
      }),
      React.createElement(ProposalGroup, {
        title: "Headlines",
        items: (proposal.headlines || []).map((it, i) => ({ key: "hl" + i, label: it.text + (it.owner ? ` — ${it.owner}` : "") })),
        picked: picked,
        toggle: toggle
      }),
      React.createElement(ProposalGroup, {
        title: "Rock notes",
        items: (proposal.rockNotes || []).map((it, i) => ({ key: "rock" + i, label: `${it.match ? it.match + ": " : ""}${it.note}` })),
        picked: picked,
        toggle: toggle
      }),
      has ? React.createElement("button", {
        onClick: apply,
        className: "tp-primary",
        style: { ...btnPrimary, marginTop: 14, display: "flex", alignItems: "center", gap: 7 }
      }, "Apply selected ", React.createElement(Icon, { name: "chevR", size: 15 })) : null
    )
  );
}

function ProposalGroup({ title, items, picked, toggle }) {
  if (!items.length) return null;
  return React.createElement("div", { style: { marginBottom: 14 } },
    React.createElement("div", { style: { fontSize: 11, textTransform: "uppercase", letterSpacing: 0.6, color: t.muted, fontWeight: 600, marginBottom: 6 } }, title),
    items.map(it => React.createElement("label", {
      key: it.key,
      style: {
        display: "flex",
        gap: 10,
        alignItems: "flex-start",
        padding: "7px 8px",
        borderRadius: 7,
        cursor: "pointer",
        background: picked[it.key] ? RAG.G.soft : "transparent"
      }
    },
    React.createElement("input", {
      type: "checkbox",
      checked: !!picked[it.key],
      onChange: () => toggle(it.key),
      style: { width: 16, height: 16, accentColor: t.green, marginTop: 2, cursor: "pointer" }
    }),
    React.createElement("span", { style: { fontSize: 14, color: t.ink } }, it.label)
    ))
  );
}

function boardToText(b) {
  const l = [];
  l.push("METRICS:");
  b.metrics.forEach(m => {
    const h = m.history;
    const last = h[h.length - 1];
    const c = cumulativeOf(m);
    l.push(`- ${m.name}: latest ${last ? fmtVal(last.value) : "—"}${c != null ? ", cumulative " + fmtVal(c) : ""} (target ${m.goal}) [${RAG[m.rag].label}] (${m.owner})`);
  });
  l.push("ROCKS:");
  b.rocks.forEach(r => l.push(`- ${r.title.slice(0, 120)}: ${r.pct}% by ${r.due} [${RAG[r.rag].label}] (${r.owner})`));
  l.push("ISSUES:");
  b.issues.forEach(i => l.push(`- P${i.priority} ${i.title} [${RAG[i.rag].label}]${i.note ? " — " + i.note : ""}`));
  l.push("TO-DOS:");
  b.todos.forEach(d => l.push(`- [${d.done ? "done" : isOverdue(d.due) ? "LATE" : "open"}] ${d.task} (${d.owner}${d.due ? ", due " + d.due : ""})`));
  l.push("HEADLINES:");
  b.headlines.forEach(h => l.push(`- ${h.title}${h.commentary ? ": " + h.commentary : ""}${h.status ? " [" + h.status + "]" : ""}`));
  return l.join("\n");
}
